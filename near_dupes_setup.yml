---
- name: Deploy and run near-duplicate detection pipeline
  hosts: target
  become: true

  vars:
    zfs_mountpoint: /pool/data
    scan_paths:
      - /pool/data/photos
      - /pool/data/documents
    output_dir: /var/lib/rmlint/near_dupes
    venv_path: /opt/near_dupes_venv
    scripts_dir: /opt/near_dupes
    phash_threshold: 5
    text_sim_threshold: 0.85
    # sentence-transformers loads a ~90 MB model plus all document embeddings into RAM.
    # 2048 MB is a safe minimum; raise if scanning tens of thousands of documents.
    scan_min_free_mb_ml: 2048

  tasks:

    - name: Assert sufficient free RAM for ML workload
      ansible.builtin.assert:
        that:
          - ansible_memfree_mb >= scan_min_free_mb_ml
        fail_msg: >
          Only {{ ansible_memfree_mb }} MB free RAM (minimum: {{ scan_min_free_mb_ml }} MB).
          sentence-transformers requires significant RAM to load embeddings.
          Run zfs_tune.yml to cap the ZFS ARC and free memory, or lower scan_min_free_mb_ml.
        success_msg: "{{ ansible_memfree_mb }} MB free RAM — OK for ML scanning."

    - name: Ensure system packages are installed
      ansible.builtin.package:
        name:
          - python3
          - python3-venv
          - python3-pip
          - libimage-exiftool-perl
          - poppler-utils
          - jq
        state: present

    - name: Ensure virtualenv exists
      ansible.builtin.command:
        cmd: python3 -m venv {{ venv_path }}
        creates: "{{ venv_path }}/bin/activate"

    - name: Install Python dependencies in venv
      ansible.builtin.pip:
        name:
          - imagehash
          - Pillow
          - sentence-transformers
        state: present
        virtualenv: "{{ venv_path }}"

    - name: Ensure scripts directory exists
      ansible.builtin.file:
        path: "{{ scripts_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy image near-duplicate detector
      ansible.builtin.copy:
        src: scripts/image_near_dupes.py
        dest: "{{ scripts_dir }}/image_near_dupes.py"
        mode: "0755"

    - name: Deploy document near-duplicate detector
      ansible.builtin.copy:
        src: scripts/doc_near_dupes.py
        dest: "{{ scripts_dir }}/doc_near_dupes.py"
        mode: "0755"

    - name: Ensure output directory exists
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"

    - name: Extract EXIF metadata from images
      ansible.builtin.shell:
        cmd: >
          exiftool -json -r
          -ext jpg -ext jpeg -ext png -ext heic -ext tiff
          -DateTimeOriginal -CreateDate -ImageSize -Model -FileSize -FileName
          {{ scan_paths | map('quote') | join(' ') }}
          > {{ output_dir | quote }}/exif_metadata.json
      # exiftool -r recurses directories internally; avoids xargs -P interleaving
      # that would produce corrupted JSON when parallel workers share stdout.
      changed_when: false
      failed_when: false

    - name: Run image near-duplicate detection
      ansible.builtin.command:
        argv: >-
          {{ [venv_path + '/bin/python', scripts_dir + '/image_near_dupes.py',
              phash_threshold | string,
              output_dir + '/image_near_dupes.json'] + scan_paths }}
      changed_when: false
      register: image_result

    - name: Run document near-duplicate detection
      ansible.builtin.command:
        argv: >-
          {{ [venv_path + '/bin/python', scripts_dir + '/doc_near_dupes.py',
              text_sim_threshold | string,
              output_dir + '/doc_near_dupes.json'] + scan_paths }}
      changed_when: false
      register: doc_result

    - name: Report results
      ansible.builtin.debug:
        msg: |
          Near-duplicate scan complete.

          {{ image_result.stdout }}
          {{ doc_result.stdout }}

          Results:
            EXIF metadata:  {{ output_dir }}/exif_metadata.json
            Image clusters: {{ output_dir }}/image_near_dupes.json
            Doc clusters:   {{ output_dir }}/doc_near_dupes.json

          Review with:
            jq '.[] | .files' {{ output_dir }}/image_near_dupes.json
            jq '.[] | .files' {{ output_dir }}/doc_near_dupes.json

          Nothing has been deleted. These are reports only.

